# Copy to config.toml and edit. Secrets can also come from environment
# variables: WHATSAPP_TOKEN, WHATSAPP_PHONE_NUMBER_ID, SMTP_PASSWORD.

[general]
contacts_file = "data/contacts.csv"
state_file = "data/sent.json"
# Used to turn local numbers like 09876 543210 into +91 9876543210.
default_country_code = "91"
# Preferred order when a contact has several handles and no 'channel' set.
channel_order = ["whatsapp", "instagram", "facebook"]
# One is picked at random per person. Placeholders: {first_name} {name} {age}
messages = [
  "Happy birthday, {first_name}! 🎉 Wishing you a fantastic year ahead.",
  "Happy birthday {first_name}! 🎂 Hope your day is as awesome as you are.",
]

# Fully automatic WhatsApp sending via Meta's official WhatsApp Cloud API.
# Requires a WhatsApp Business number + an approved template whose body has
# one variable, e.g. "Happy birthday {{1}}! 🎉 Have a great day."
[whatsapp_cloud]
enabled = false
phone_number_id = ""
access_token = ""          # prefer the WHATSAPP_TOKEN env var
template_name = "birthday_wish"
template_language = "en"

# Reminders with one-tap chat links, for Instagram / Facebook / personal
# WhatsApp. Always printed to the console; also emailed if SMTP is set.
[reminders]
email_to = ""
smtp_host = ""             # e.g. smtp.gmail.com (use an app password)
smtp_port = 587
smtp_user = ""
smtp_password = ""         # prefer the SMTP_PASSWORD env var
